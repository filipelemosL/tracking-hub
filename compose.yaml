services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracking_hub
      POSTGRES_USER: tracking_hub
      POSTGRES_PASSWORD: tracking_hub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_hub -d tracking_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tracking_hub:tracking_hub@postgres:5432/tracking_hub?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tracking_hub:tracking_hub@postgres:5432/tracking_hub?schema=public
      WORKER_POLL_INTERVAL_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
