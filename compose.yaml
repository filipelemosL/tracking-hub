services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking_hub}
      POSTGRES_USER: ${POSTGRES_USER:-tracking_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: tracking_hub_test
      POSTGRES_USER: tracking_hub
      POSTGRES_PASSWORD: tracking_hub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_hub -d tracking_hub_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
