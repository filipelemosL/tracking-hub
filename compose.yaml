services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking_hub}
      POSTGRES_USER: ${POSTGRES_USER:-tracking_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: tracking_hub_test
      POSTGRES_USER: tracking_hub
      POSTGRES_PASSWORD: tracking_hub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_hub -d tracking_hub_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: build
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracking_hub}:${POSTGRES_PASSWORD:-tracking_hub}@db:5432/${POSTGRES_DB:-tracking_hub}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    image: tracking-hub-app:local
    build: .
    command: ["node", "dist/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracking_hub}:${POSTGRES_PASSWORD:-tracking_hub}@db:5432/${POSTGRES_DB:-tracking_hub}?schema=public
      CONVERSION_MODE: simulated
      ENABLE_TEST_SCENARIOS: ${ENABLE_TEST_SCENARIOS:-false}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true

  worker:
    image: tracking-hub-app:local
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracking_hub}:${POSTGRES_PASSWORD:-tracking_hub}@db:5432/${POSTGRES_DB:-tracking_hub}?schema=public
      CONVERSION_MODE: simulated
      TRANSPORT_TIMEOUT_MS: ${TRANSPORT_TIMEOUT_MS:-2000}
      DELIVERY_LEASE_MS: ${DELIVERY_LEASE_MS:-10000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      ATTRIBUTION_WINDOW_MINUTES: ${ATTRIBUTION_WINDOW_MINUTES:-30}
      TRACKING_WAIT_MS: ${TRACKING_WAIT_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true

volumes:
  postgres_data:
  postgres_test_data:
